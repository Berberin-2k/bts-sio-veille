name: Veille technologique quotidienne

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/veille.yml'
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Paris

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-publication
  # A new code release supersedes an older still-running sync. This prevents
  # old jobs from blocking the deployment or racing to publish obsolete JSON.
  cancel-in-progress: true

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Always start from latest published data, not a stale push SHA
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Collecter et résumer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/collect.py
      - name: Vérifier les trois jeux de données et leurs invariants
        run: |
          python -m json.tool site/data/recent.json > /dev/null
          python -m json.tool site/data/archives.json > /dev/null
          python -m json.tool site/data/articles.json > /dev/null
          python -m json.tool site/data/cvss-cache.json > /dev/null
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          from scripts.retention import partition_articles
          directory = Path("site/data")
          recent = json.loads((directory / "recent.json").read_text(encoding="utf-8"))
          archive = json.loads((directory / "archives.json").read_text(encoding="utf-8"))
          legacy = json.loads((directory / "articles.json").read_text(encoding="utf-8"))
          assert recent["version"] == archive["version"] == 2
          assert recent["recent_count"] == len(recent["articles"])
          assert recent["archive_count"] == len(archive["articles"])
          assert len(recent["articles"]) + len(archive["articles"]) <= 1000
          assert legacy["articles"] == recent["articles"]
          cache = json.loads((directory / "cvss-cache.json").read_text(encoding="utf-8"))
          assert cache.get("version") == 1 and isinstance(cache.get("entries"), dict)
          assert len(cache["entries"]) <= 2400
          allowed = {"critique","elevee","moderee","faible","aucune","non_evaluee","information"}
          for row in recent["articles"] + archive["articles"]:
              assert row.get("severity") in allowed
              if row.get("severity_basis") == "nvd_cvss":
                  assert row.get("severity_cve") in row.get("cve_ids", [])
                  assert isinstance(row.get("cvss_score"), (int, float))
                  assert 0 <= row["cvss_score"] <= 10
                  assert row.get("severity_source_url") == (
                      "https://nvd.nist.gov/vuln/detail/" + row["severity_cve"]
                  )
                  assert row.get("cve_assessed_count", 0) >= 1
          all_urls = [a["url"] for a in recent["articles"] + archive["articles"]]
          assert len(all_urls) == len(set(all_urls)), "URLs dupliquées"
          now = dt.datetime.fromisoformat(recent["generated_at"].replace("Z", "+00:00"))
          test_recent, test_archive = partition_articles(recent["articles"] + archive["articles"], now)
          assert test_recent == recent["articles"] and test_archive == archive["articles"]
          print("Validation OK:", len(test_recent), "récents;", len(test_archive), "archives")
          PY
      - name: Enregistrer les nouveaux articles et archives
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          git config user.name 'veille-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/articles.json site/data/recent.json site/data/archives.json site/data/cvss-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: veille récente et archives quotidiennes'
          fi
          # If remote changed, discard only our unpushed generated files, fetch the
          # latest authoritative history, and run the collector again against it.
          # Never force push or merge conflicting JSON by choosing one side.
          succeeded=0
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              succeeded=1
              break
            fi
            echo "Concurrent push on attempt $attempt: refetching and rebuilding JSON."
            git fetch origin main
            git reset --hard origin/main
            python scripts/collect.py
            python -m json.tool site/data/recent.json > /dev/null
            python -m json.tool site/data/archives.json > /dev/null
            python -m json.tool site/data/articles.json > /dev/null
            python -m json.tool site/data/cvss-cache.json > /dev/null
            git add site/data/articles.json site/data/recent.json site/data/archives.json site/data/cvss-cache.json
            if git diff --cached --quiet; then
              succeeded=1
              break
            fi
            git commit -m 'data: veille récente et archives quotidiennes (rebuilt)'
          done
          if [ "$succeeded" != 1 ]; then
            echo 'Could not push data safely after three attempts.' >&2
            exit 1
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Uploader le contenu public
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier sur GitHub Pages
        uses: actions/deploy-pages@v4
