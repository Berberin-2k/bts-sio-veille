name: Veille technologique quotidienne

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/veille.yml'
  schedule:
    - cron: '17 6 * * *'
      timezone: Europe/Paris

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: veille-publication
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests unitaires
        run: python -m unittest discover -s tests -v
      - name: Collecter et résumer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python scripts/collect.py
      - name: Vérifier le JSON
        run: python -m json.tool site/data/articles.json > /dev/null
      - name: Enregistrer les nouveaux articles
        run: |
          if ! git diff --quiet -- site/data/articles.json; then
            git config user.name 'veille-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add site/data/articles.json
            git commit -m 'data: synchronisation veille quotidienne'
            git push
          fi
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Uploader le contenu public
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publier sur GitHub Pages
        uses: actions/deploy-pages@v4
